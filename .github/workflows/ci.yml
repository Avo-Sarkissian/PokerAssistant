name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Whatever the image ships, newest first, rather than a pinned version.
      # `Xcode_16.app` was pinned here and the pin outlived its platform: on this runner
      # image Xcode 16 has no iOS runtime installed, so *every* simulator destination is
      # ineligible and the first `xcodebuild` step fails with "iOS 18.0 is not installed"
      # no matter which device is named. Taking the newest also narrows the gap with the
      # developer machine — a branch that passed 224 local tests failed the first CI step
      # on a trailing comma, which is Swift 6.1 syntax that Xcode 16's 6.0 rejects.
      - name: Select Xcode
        run: |
          sudo xcode-select -switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version && swift --version
          echo "--- installed simulator runtimes ---"
          xcrun simctl list runtimes

      # The engine's own suite needs no simulator and is by far the fastest signal in
      # this workflow, so it runs before anything is booted. If the maths is wrong,
      # fail here rather than eight minutes later.
      #
      # This is the larger half of the project's tests, and `xcodebuild -scheme PokerAssistant
      # test` does not run any of them — Xcode will not treat a SwiftPM test target as
      # a testable from a project-based scheme. `scripts/test` runs both suites; the
      # two steps here are deliberately kept separate so a failure names which one.
      - name: Test PokerCore
        run: swift test --package-path Packages/PokerCore

      # The external anchors — every check against numbers this repository did not
      # produce that is too slow for the fast loop: the exhaustive C(52,7) category
      # census, and the classic matchups enumerated over all 1,712,304 boards.
      #
      # They are gated behind POKER_EXTERNAL_ANCHORS, which means that without this step
      # they never run unattended, and a *skipped* test is a green run. They were added
      # to prove the engine is not merely self-consistent; leaving them off here would
      # have made that proof a one-time manual observation rather than a regression
      # guard. Release because the census is ~21s compiled and ~7 minutes interpreted.
      - name: External anchors (census and published matchups)
        run: ./scripts/test anchors

      # `generic/platform=iOS Simulator` for the two build-only steps: they need the SDK,
      # not a device, and naming one is how this workflow broke. The device that does get
      # named — by `scripts/test`, for the test step below — is resolved from what is
      # actually installed.
      - name: Build
        run: |
          xcodebuild \
            -project PokerAssistant.xcodeproj \
            -scheme PokerAssistant \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build

      # The engine's whole value is correct probabilities. These are the tests that
      # would have caught the evaluator, sampling and routing defects.
      # Through the script rather than around it, so CI and the developer's fast loop
      # cannot drift: `scripts/test` already resolves a destination from the simulators
      # that exist, which is the whole reason it stopped hard-coding a device name.
      - name: Test
        run: ./scripts/test app

      - name: Release build
        run: |
          xcodebuild \
            -project PokerAssistant.xcodeproj \
            -scheme PokerAssistant \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            build
