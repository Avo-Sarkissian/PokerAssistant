name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Build
        run: |
          xcodebuild \
            -project PokerAssistant.xcodeproj \
            -scheme PokerAssistant \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            build

      # The engine's whole value is correct probabilities. These are the tests that
      # would have caught the evaluator, sampling and routing defects.
      - name: Test
        run: |
          xcodebuild \
            -project PokerAssistant.xcodeproj \
            -scheme PokerAssistant \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:PokerAssistantTests \
            test

      - name: Release build
        run: |
          xcodebuild \
            -project PokerAssistant.xcodeproj \
            -scheme PokerAssistant \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Release \
            build
